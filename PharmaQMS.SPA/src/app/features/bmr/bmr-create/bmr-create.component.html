<div class="min-h-screen bg-slate-50 px-4 py-4 text-slate-800">
  <div class="mx-auto max-w-6xl">
    <button (click)="back()" class="mb-4 text-sm text-indigo-500">BMR &rsaquo; Nieuw BMR</button>

    <h1 class="mb-4 text-2xl font-semibold text-slate-900">
      Batch Manufacturing Record aanmaken
    </h1>

    <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
      <div class="p-5">
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <div>
            <label
              for="masterRecipe"
              class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-500"
            >
              Masterrecept
            </label>
            <select
              id="masterRecipe"
              [(ngModel)]="selectedMasterRecipeId"
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            >
              <option *ngFor="let recipe of masterRecipes" [value]="recipe.id">
                {{ recipe.recipeName }}
              </option>
            </select>
          </div>

          <div>
            <label
              for="batchSize"
              class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-500"
            >
              Batchgrootte (kg)
            </label>
            <input
              id="batchSize"
              type="number"
              [(ngModel)]="batchSize"
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            />
          </div>

          <div>
            <label
              for="plannedBmrDate"
              class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-500"
            >
              Geplande startdatum
            </label>
            <input
              id="plannedBmrDate"
              [(ngModel)]="plannedBmrDate"
              readonly
              type="date"
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            />
          </div>

          <div>
            <label
              for="productionLine"
              class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-500"
            >
              Productielijn
            </label>
            <select
              id="productionLine"
              [(ngModel)]="selectedProductionLineId"
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            >
              <option *ngFor="let line of productionLines" [value]="line.id">
                {{ line.lineName }}
              </option>
            </select>
          </div>
        </div>

        <div class="mt-4">
          <h2 class="mb-3 text-base font-semibold text-slate-900">
            Gekoppelde grondstoflots
          </h2>

          <fieldset style="border: none; padding: 0; margin: 0">
            <legend class="mb-3 text-sm font-medium text-slate-900">
              Gekoppelde grondstoflots
              <span class="text-xs font-normal text-slate-500"
                >(minstens één vereist)</span
              >
            </legend>

            <div
              class="overflow-hidden rounded-lg border border-slate-200 bg-white"
            >
              <label
                *ngFor="let lot of availableLots; let last = last"
                [class.border-b]="!last"
                class="flex cursor-pointer items-center gap-3 border-slate-200 px-4 py-3 transition-colors hover:bg-slate-50"
              >
                <input
                  type="checkbox"
                  [id]="'lot-' + lot.id"
                  [checked]="selectedLotIds.has(lot.id)"
                  (change)="toggleLot(lot.id)"
                  class="h-4 w-4 shrink-0 cursor-pointer accent-blue-600"
                />
                <span class="flex-1 text-sm text-slate-800">{{
                  lot.rawMaterialName
                }}</span>
                <span class="text-xs tabular-nums text-slate-500">{{
                  lot.lotNumber
                }}</span>
                <span
                  class="rounded-full bg-green-50 px-2 py-0.5 text-xs font-medium text-green-700"
                >
                  {{ lot.status }}
                </span>
              </label>
            </div>

            <p
              role="status"
              aria-live="polite"
              class="mt-2 text-xs"
              [class.text-slate-500]="selectedLotIds.size > 0"
              [class.text-red-500]="selectedLotIds.size === 0"
            >
              {{ selectedLotIds.size }} van {{ availableLots.length }} lots
              geselecteerd
            </p>
          </fieldset>

          <div class="mt-6 border-t border-slate-200 pt-4">
            <div class="flex justify-end gap-3">
              <button
                type="button"
                (click)="cancel()"
                class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
              >
                Annuleren
              </button>

              <button
                type="button"
                (click)="createAndStart()"
                [disabled]="!isFormValid || isSubmitting"
                class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50"
              >
                BMR aanmaken &amp; starten
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
