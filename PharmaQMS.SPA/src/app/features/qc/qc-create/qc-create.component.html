<section class="min-h-screen bg-slate-100 px-4 py-6 text-slate-800">
  <div class="mx-auto max-w-5xl">
    <button
      type="button"
      (click)="cancel()"
      class="mb-3 text-sm font-medium text-slate-500 hover:text-slate-700"
    >
      QC > Create test
    </button>

    <h1 class="mb-4 text-3xl font-semibold text-slate-900">Create QC test</h1>

    <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
      <div *ngIf="loading" class="py-10 text-center text-slate-500">
        Loading lots and batches...
      </div>

      <ng-container *ngIf="!loading">
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <div>
            <label
              class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-500"
            >
              Test object
            </label>
            <select
              [(ngModel)]="testObjectType"
              (change)="onTestObjectTypeChanged()"
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            >
              <option *ngFor="let type of objectTypes" [value]="type">
                {{
                  type === "Batch" ? "Batch (finished product)" : "Lot (raw material)"
                }}
              </option>
            </select>
          </div>

          <div>
            <label
              class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-500"
            >
              Lot / Batch
            </label>
            <select
              [(ngModel)]="selectedTestObjectId"
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            >
              <option [ngValue]="null" disabled>Select an object</option>
              <option
                *ngFor="let option of testObjectOptions"
                [ngValue]="option.testObjectId"
              >
                {{ option.label }}
              </option>
            </select>
            <p
              *ngIf="!testObjectOptions.length"
              class="mt-2 text-xs text-amber-700"
            >
              No suitable
              {{
                testObjectType === "Lot"
                  ? "lots in Quarantine"
                  : "batches in QC"
              }}
              found.
            </p>
          </div>
        </div>

        <div class="mt-5 rounded-lg border border-slate-200 bg-slate-50 p-4">
          <h2
            class="mb-3 text-sm font-semibold uppercase tracking-wider text-slate-500"
          >
            Add test parameters
          </h2>

          <div
            class="mb-2 grid grid-cols-12 gap-2 text-xs font-semibold uppercase tracking-wider text-slate-500"
          >
            <div class="col-span-12 md:col-span-6">Parameter</div>
            <div class="col-span-4 md:col-span-2">Min</div>
            <div class="col-span-4 md:col-span-2">Max</div>
            <div class="col-span-3 md:col-span-1">Unit</div>
            <div class="col-span-1"></div>
          </div>

          <div
            *ngFor="let parameter of parameters; let i = index"
            class="mb-2 grid grid-cols-12 gap-2"
          >
            <input
              [(ngModel)]="parameter.name"
              placeholder="Parameter"
              class="col-span-12 rounded-md border border-slate-300 px-3 py-2 text-sm md:col-span-6"
            />
            <input
              type="number"
              [(ngModel)]="parameter.min"
              placeholder="Min."
              class="col-span-4 rounded-md border border-slate-300 px-3 py-2 text-sm md:col-span-2"
            />
            <input
              type="number"
              [(ngModel)]="parameter.max"
              placeholder="Max."
              class="col-span-4 rounded-md border border-slate-300 px-3 py-2 text-sm md:col-span-2"
            />
            <input
              [(ngModel)]="parameter.unit"
              placeholder="Unit"
              class="col-span-3 rounded-md border border-slate-300 px-3 py-2 text-sm md:col-span-1"
            />
            <button
              type="button"
              (click)="removeParameter(i)"
              class="col-span-1 rounded-md border border-slate-300 text-sm text-slate-600 hover:bg-slate-100"
              [disabled]="parameters.length === 1"
            >
              -
            </button>
          </div>

          <button
            type="button"
            (click)="addParameter()"
            class="mt-2 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-100"
          >
            + Add parameter
          </button>
        </div>

        <div class="mt-5 max-w-md">
          <label
            class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-500"
          >
            Electronic signature (password)
          </label>
          <input
            type="password"
            [(ngModel)]="password"
            autocomplete="current-password"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
          />
        </div>

        <p
          *ngIf="errorMessage"
          class="mt-4 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"
        >
          {{ errorMessage }}
        </p>

        <div class="mt-6 flex justify-end gap-3 border-t border-slate-200 pt-4">
          <button
            type="button"
            (click)="cancel()"
            class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
          >
            Cancel
          </button>
          <button
            type="button"
            (click)="createQcTest()"
            [disabled]="!canSubmit"
            class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50"
          >
            {{ submitting ? "Submitting..." : "Create test" }}
          </button>
        </div>
      </ng-container>
    </div>
  </div>
</section>
