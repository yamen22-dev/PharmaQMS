<ng-container *ngIf="session$ | async as session; else authLayout">
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-branding">
        <div class="logo-icon">📋</div>
        <div>
          <p class="brand-name">PharmaQMS</p>
          <p class="brand-tagline">QUALITY MANAGEMENT</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <h3 class="nav-title">NAVIGATIE</h3>
        <ng-container *ngFor="let item of navigationItems">
          <a
            *ngIf="canShowNavigationItem(item)"
            [routerLink]="item.route"
            routerLinkActive="active"
            class="nav-item"
          >
            <span class="nav-icon">{{ item.icon }}</span>
            <span>{{ item.label }}</span>
          </a>
        </ng-container>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="avatar">
            {{ session.firstName.charAt(0) }}{{ session.lastName.charAt(0) }}
          </div>
          <div class="user-info">
            <p class="user-name">
              {{ session.firstName }} {{ session.lastName }}
            </p>
            
            <p class="user-role">{{ session.roles[0] }}</p>
          </div>
        </div>
        <button
          type="button"
          class="logout-btn"
          (click)="logout()"
          title="Logout"
          aria-label="Logout"
        >
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</ng-container>

<ng-template #authLayout>
  <div class="auth-wrapper">
    <router-outlet></router-outlet>
  </div>
</ng-template>
